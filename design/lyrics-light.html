<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Car Pi lyrics screen, light mode</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#556070}a:hover{color:#2a313a}
</style>
</head>
<body>
<div style="width: 1024px; height: 600px; box-sizing: border-box; display: grid; grid-template-columns: 404px 620px; background: #eef1f4; color: #12161b; font-family: Barlow, 'Segoe UI', sans-serif">

  <div style="box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid #d0d6de">
    <a href="home-light.html" aria-label="Back to home" style="height: 340px; border-radius: 18px; background: #dfe4ea; border: 1px solid #c9d0d9; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-decoration: none; font-size: 19px">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#7b8696" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg>
      <span>Song picture</span>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 32px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[Song name]</div>
      <div style="font-size: 22px; color: #556070; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[Artist]</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="height: 6px; border-radius: 3px; background: #cfd5dd; overflow: hidden">
        <div style="width: 38%; height: 6px; border-radius: 3px; background: #a35400"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 17px; color: #556070; font-variant-numeric: tabular-nums">
        <span>[Elapsed]</span>
        <span>[Length]</span>
      </div>
    </div>
  </div>

  <div style="box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; justify-content: center; gap: 22px">
    <div style="font-size: 26px; font-weight: 500; color: #636b78">[Earlier lyric line]</div>
    <div style="font-size: 28px; font-weight: 500; color: #556070">[Previous lyric line]</div>
    <div style="font-size: 46px; font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; color: #a35400">[Current lyric line, shown large]</div>
    <div style="font-size: 30px; font-weight: 600; color: #2a313a">[Next lyric line]</div>
    <div style="font-size: 28px; font-weight: 500; color: #556070">[Upcoming lyric line]</div>
    <div style="font-size: 26px; font-weight: 500; color: #636b78">[Upcoming lyric line]</div>
  </div>

</div>
</body>
</html>
