<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Car Pi home screen</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9aa4b2}a:hover{color:#d3d9e1}
</style>
</head>
<body>
<div style="width: 1024px; height: 600px; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; background: #0c0f12; color: #f3f5f7; font-family: Barlow, 'Segoe UI', sans-serif">

  <div style="display: flex; justify-content: space-between; align-items: center; height: 60px">
    <div style="font-size: 36px; font-weight: 600; letter-spacing: -0.01em">Hello, Gabriel</div>
    <div style="display: flex; align-items: center; gap: 22px">
      <div style="font-size: 21px; color: #9aa4b2">Wed, Oct 7</div>
      <div style="font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em">1:49</div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 21px; color: #9aa4b2">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9aa4b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 9.5a4.25 4.25 0 0 1 .5 8.5z"></path></svg>
        <span>[Temp]</span>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 580px 352px; gap: 28px; height: 464px">

    <div style="display: flex; flex-direction: column; gap: 16px">
      <div style="height: 364px; border-radius: 18px; overflow: hidden; background: #151a20; border: 1px solid #252c35; box-sizing: border-box">
        <svg viewBox="0 0 580 364" width="100%" height="100%" style="display: block" role="img" aria-label="Map with the route ahead">
          <rect x="0" y="0" width="580" height="364" fill="#151a20"></rect>
          <path d="M-10 250 H590" stroke="#222932" stroke-width="16"></path>
          <path d="M-10 60 H590" stroke="#222932" stroke-width="10"></path>
          <path d="M70 -10 V374" stroke="#222932" stroke-width="10"></path>
          <path d="M370 -10 V374" stroke="#222932" stroke-width="16"></path>
          <path d="M480 -10 L330 374" stroke="#222932" stroke-width="8"></path>
          <path d="M210 -10 V374" stroke="#222932" stroke-width="16"></path>
          <path d="M-10 150 H590" stroke="#222932" stroke-width="16"></path>
          <path d="M210 300 V178 Q210 150 238 150 H590" fill="none" stroke="#5aa9ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="210" cy="300" r="22" fill="#5aa9ff" fill-opacity="0.22"></circle>
          <circle cx="210" cy="300" r="14" fill="#f3f5f7"></circle>
          <path d="M210 291 L217 306 L210 302.5 L203 306 Z" fill="#1d6fd1"></path>
        </svg>
      </div>
      <div style="height: 84px; border-radius: 18px; background: #151a20; border: 1px solid #252c35; box-sizing: border-box; padding: 0 22px; display: flex; align-items: center; gap: 18px">
        <div style="width: 52px; height: 52px; border-radius: 12px; background: #5aa9ff; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0c0f12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20v-7a4 4 0 0 1 4-4h9"></path><path d="M15 5l4 4-4 4"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
          <div style="font-size: 28px; font-weight: 700; line-height: 1.1">Turn right</div>
          <div style="font-size: 19px; color: #9aa4b2">[Street name]</div>
        </div>
        <div style="font-size: 26px; font-weight: 600; color: #f3f5f7">[Distance]</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <a href="lyrics-dark.html" aria-label="Show lyrics" style="height: 352px; border-radius: 18px; background: #1a2028; border: 1px solid #2a323c; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-decoration: none; font-size: 19px">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#5b6675" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg>
        <span>Song picture</span>
      </a>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 30px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[Song name]</div>
        <div style="font-size: 21px; color: #9aa4b2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[Artist]</div>
      </div>
      <div style="height: 6px; border-radius: 3px; background: #2a323c; overflow: hidden">
        <div style="width: 38%; height: 6px; border-radius: 3px; background: #ffb14a"></div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
